name: Nova APK Uretici (Temiz Kurulum)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Depoyu Cek
      uses: actions/checkout@v5
      
    - name: Java 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Eski Kalintilari Temizle ve Projeyi Sifirdan Kur
      run: |
        # 1. ESKİ HATALI DOSYALARI TAMAMEN SİLİYORUZ (Önbellek zehirlenmesini bitirir)
        rm -rf app
        
        # 2. PROJE KLASÖRLERİNİ SIFIRDAN YARATIYORUZ
        mkdir -p app/src/main/java/com/sert/nova
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        mkdir -p app/src/main/res/values
        
        # 3. İKON EKSİKLİĞİ HATASINI KÖKÜNDEN ÇÖZÜYORUZ
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#121212" android:pathData="M0,0h108v108h-108z"/>
        </vector>
        EOF
        
        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_background"/>
        </adaptive-icon>
        EOF
        
        # 4. GÜVENLİ MANİFEST DOSYASI (Çökmeyi engeller)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sert.nova">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
            
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Nova"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # 5. GÜNCEL KOTLİN MEDYA OYNATICI KODLARI (Tırnak hataları giderildi)
        cat << 'EOF' > app/src/main/java/com/sert/nova/MainActivity.kt
        package com.sert.nova
        
        import android.net.Uri
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.rememberLauncherForActivityResult
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.unit.dp
        import androidx.media3.common.MediaItem
        import androidx.media3.common.PlaybackParameters
        import androidx.media3.exoplayer.ExoPlayer
        import kotlinx.coroutines.delay
        import java.util.Locale
        
        class MainActivity : ComponentActivity() {
            private lateinit var player: ExoPlayer
            
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                player = ExoPlayer.Builder(this).build()
                setContent {
                    MaterialTheme {
                        Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                            OynaticiEkrani(player = player)
                        }
                    }
                }
            }
            
            override fun onDestroy() {
                super.onDestroy()
                player.release()
            }
        }
        
        @Composable
        fun OynaticiEkrani(player: ExoPlayer) {
            var secilenMuzikUri by remember { mutableStateOf<Uri?>(null) }
            var muzinismi by remember { mutableStateOf("Henüz dosya seçilmedi") }
            var playbackSpeed by remember { mutableFloatStateOf(1.0f) }
            var isLooping by remember { mutableStateOf(false) }
            
            val launcher = rememberLauncherForActivityResult(contract = ActivityResultContracts.GetContent()) { uri: Uri? ->
                uri?.let {
                    secilenMuzikUri = it
                    muzinismi = it.lastPathSegment ?: "Bilinmeyen Parça"
                    val mediaItem = MediaItem.fromUri(it)
                    player.setMediaItem(mediaItem)
                    player.prepare()
                    player.play()
                }
            }
            
            LaunchedEffect(isLooping) {
                while (isLooping) {
                    if (player.currentPosition >= (player.duration - 100L).coerceAtLeast(0L)) {
                        player.seekTo(0)
                    }
                    delay(100)
                }
            }
            
            Column(modifier = Modifier.fillMaxSize().padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Top) {
                Spacer(modifier = Modifier.height(20.dp))
                Text(text = "Nova Player", style = MaterialTheme.typography.headlineMedium)
                Spacer(modifier = Modifier.height(20.dp))
                
                Button(onClick = { launcher.launch("audio/*") }, modifier = Modifier.fillMaxWidth()) {
                    Text("Cihazdan Müzik Seç")
                }
                Spacer(modifier = Modifier.height(10.dp))
                Text(text = muzinismi, style = MaterialTheme.typography.bodyMedium)
                
                Spacer(modifier = Modifier.height(30.dp))
                
                Row(horizontalArrangement = Arrangement.SpaceEvenly, modifier = Modifier.fillMaxWidth()) {
                    Button(onClick = { player.play() }) { Text("Oynat") }
                    Button(onClick = { player.pause() }) { Text("Duraklat") }
                }
                Spacer(modifier = Modifier.height(20.dp))
                
                Row(horizontalArrangement = Arrangement.SpaceEvenly, modifier = Modifier.fillMaxWidth()) {
                    Button(onClick = { player.seekTo((player.currentPosition - 10000L).coerceAtLeast(0L)) }) { Text("-10 Sn") }
                    Button(onClick = { player.seekTo((player.currentPosition + 10000L).coerceAtMost(player.duration)) }) { Text("+10 Sn") }
                }
                Spacer(modifier = Modifier.height(30.dp))
                
                Text(text = "Hız: " + String.format(Locale.US, "%.2f", playbackSpeed) + "x")
                Slider(value = playbackSpeed, onValueChange = { playbackSpeed = it; player.playbackParameters = PlaybackParameters(it) }, valueRange = 0.5f..2.5f)
                
                Spacer(modifier = Modifier.height(20.dp))
                Row(modifier = Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                    Checkbox(checked = isLooping, onCheckedChange = { isLooping = it })
                    Text("Başa Sararak Tekrarla")
                }
            }
        }
        EOF
        
        # 6. GRADLE MOTORU VE KÜTÜPHANE AYARLARI (Senkronizasyon sorunlarını çözer)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.sert.nova'
            compileSdk 34
            defaultConfig {
                applicationId "com.sert.nova"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            buildFeatures {
                compose true
            }
            composeOptions {
                kotlinCompilerExtensionVersion '1.5.1'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2023.08.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
        }
        EOF

    - name: APK Derleme Islemi
      run: |
        GRADLE_VERSION=8.2.1
        wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
        unzip -q gradle-${GRADLE_VERSION}-bin.zip
        export PATH=$PWD/gradle-${GRADLE_VERSION}/bin:$PATH
        gradle wrapper --gradle-version ${GRADLE_VERSION}
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        
    - name: APK Yukle
      uses: actions/upload-artifact@v5
      with:
        name: Nova-App
        path: app/build/outputs/apk/debug/app-debug.apk
