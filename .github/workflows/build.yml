name: Nova APK Uretici (PRO Surum)
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Depoyu Cek
      uses: actions/checkout@v5
      
    - name: Java 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Projeyi Sifirdan Kur
      run: |
        rm -rf app
        mkdir -p app/src/main/java/com/sert/nova
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#121212" android:pathData="M0,0h108v108h-108z"/>
        </vector>
        EOF
        
        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_background"/>
        </adaptive-icon>
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sert.nova">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Nova"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/sert/nova/MainActivity.kt
        package com.sert.nova
        
        import android.content.Intent
        import android.graphics.BitmapFactory
        import android.net.Uri
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.rememberLauncherForActivityResult
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.foundation.Image
        import androidx.compose.foundation.background
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.LazyColumn
        import androidx.compose.foundation.lazy.items
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.graphics.Brush
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.asImageBitmap
        import androidx.compose.ui.layout.ContentScale
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.text.style.TextOverflow
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.documentfile.provider.DocumentFile
        import androidx.media3.common.MediaItem
        import androidx.media3.common.MediaMetadata
        import androidx.media3.common.Player
        import androidx.media3.common.PlaybackParameters
        import androidx.media3.exoplayer.ExoPlayer
        import kotlinx.coroutines.delay
        import java.util.Locale
        
        class MainActivity : ComponentActivity() {
            private lateinit var player: ExoPlayer
            
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                player = ExoPlayer.Builder(this).build()
                setContent {
                    MaterialTheme(colorScheme = darkColorScheme()) {
                        Surface(modifier = Modifier.fillMaxSize()) {
                            NovaProEkrani(player = player, activity = this)
                        }
                    }
                }
            }
            
            override fun onDestroy() {
                super.onDestroy()
                player.release()
            }
        }
        
        @Composable
        fun NovaProEkrani(player: ExoPlayer, activity: ComponentActivity) {
            var audioFiles by remember { mutableStateOf<List<DocumentFile>>(emptyList()) }
            var currentTrackName by remember { mutableStateOf("Seçim Yapılmadı") }
            var isPlaying by remember { mutableStateOf(false) }
            var artworkBitmap by remember { mutableStateOf<androidx.compose.ui.graphics.ImageBitmap?>(null) }
            var playbackSpeed by remember { mutableFloatStateOf(1.0f) }
            var isLooping by remember { mutableStateOf(false) }
            
            val bgGradient = Brush.verticalGradient(colors = listOf(Color(0xFF1E1E2C), Color(0xFF0D0D14)))
            
            DisposableEffect(player) {
                val listener = object : Player.Listener {
                    override fun onIsPlayingChanged(isPlayingState: Boolean) {
                        isPlaying = isPlayingState
                    }
                    override fun onMediaMetadataChanged(mediaMetadata: MediaMetadata) {
                        currentTrackName = mediaMetadata.title?.toString() ?: "Bilinmeyen Parça"
                        val data = mediaMetadata.artworkData
                        if (data != null) {
                            val bmp = BitmapFactory.decodeByteArray(data, 0, data.size)
                            artworkBitmap = bmp.asImageBitmap()
                        } else {
                            artworkBitmap = null
                        }
                    }
                }
                player.addListener(listener)
                onDispose { player.removeListener(listener) }
            }
            
            LaunchedEffect(isLooping) {
                while (isLooping) {
                    if (player.currentPosition >= (player.duration - 100L).coerceAtLeast(0L)) {
                        player.seekTo(0)
                    }
                    delay(100)
                }
            }
            
            val folderLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocumentTree()) { uri: Uri? ->
                uri?.let {
                    activity.contentResolver.takePersistableUriPermission(it, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                    val folder = DocumentFile.fromTreeUri(activity, it)
                    audioFiles = folder?.listFiles()?.filter { file -> 
                        file.type?.startsWith("audio/") == true 
                    } ?: emptyList()
                }
            }
            
            Box(modifier = Modifier.fillMaxSize().background(bgGradient)) {
                Column(modifier = Modifier.fillMaxSize()) {
                    // Üst Bar
                    Row(
                        modifier = Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 16.dp),
                        horizontalArrangement = Arrangement.SpaceBetween,
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Text("Nova Pro", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Color.White)
                        IconButton(onClick = { folderLauncher.launch(null) }) {
                            Icon(Icons.Filled.AddCircle, contentDescription = "Klasör Ekle", tint = Color(0xFFBB86FC), modifier = Modifier.size(32.dp))
                        }
                    }
                    
                    // Liste Alanı
                    if (audioFiles.isEmpty()) {
                        Box(modifier = Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                            Text("Müzik klasörü seçmek için sağ üstteki + simgesine dokunun.", color = Color.Gray, modifier = Modifier.padding(32.dp))
                        }
                    } else {
                        LazyColumn(modifier = Modifier.weight(1f).padding(horizontal = 16.dp)) {
                            items(audioFiles) { file ->
                                Card(
                                    modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp).clickable {
                                        val mediaItem = MediaItem.fromUri(file.uri)
                                        player.setMediaItem(mediaItem)
                                        player.prepare()
                                        player.play()
                                        currentTrackName = file.name ?: "Bilinmeyen Parça"
                                    },
                                    colors = CardDefaults.cardColors(containerColor = Color(0xFF2C2C3E)),
                                    shape = RoundedCornerShape(12.dp)
                                ) {
                                    Text(
                                        text = file.name ?: "İsimsiz Dosya",
                                        color = Color.White,
                                        modifier = Modifier.padding(16.dp),
                                        maxLines = 1,
                                        overflow = TextOverflow.Ellipsis
                                    )
                                }
                            }
                        }
                    }
                    
                    // Oynatıcı Kontrol Paneli (Alt Kısım)
                    Card(
                        modifier = Modifier.fillMaxWidth(),
                        colors = CardDefaults.cardColors(containerColor = Color(0xFF181824)),
                        shape = RoundedCornerShape(topStart = 24.dp, topEnd = 24.dp)
                    ) {
                        Column(modifier = Modifier.padding(20.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                            // Albüm Kapağı & İsim
                            if (artworkBitmap != null) {
                                Image(
                                    bitmap = artworkBitmap!!,
                                    contentDescription = "Albüm",
                                    modifier = Modifier.size(64.dp).clip(RoundedCornerShape(8.dp)),
                                    contentScale = ContentScale.Crop
                                )
                                Spacer(modifier = Modifier.height(12.dp))
                            }
                            Text(text = currentTrackName, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                            
                            Spacer(modifier = Modifier.height(20.dp))
                            
                            // Medya Kontrolleri (Simgesel)
                            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly, verticalAlignment = Alignment.CenterVertically) {
                                IconButton(onClick = { player.seekTo((player.currentPosition - 10000L).coerceAtLeast(0L)) }) {
                                    Icon(Icons.Filled.FastRewind, contentDescription = "-10 Sn", tint = Color.White, modifier = Modifier.size(36.dp))
                                }
                                
                                IconButton(
                                    onClick = { if (isPlaying) player.pause() else player.play() },
                                    modifier = Modifier.size(64.dp).background(Color(0xFFBB86FC), shape = RoundedCornerShape(32.dp))
                                ) {
                                    Icon(if (isPlaying) Icons.Filled.Pause else Icons.Filled.PlayArrow, contentDescription = "Oynat/Duraklat", tint = Color.White, modifier = Modifier.size(40.dp))
                                }
                                
                                IconButton(onClick = { player.seekTo((player.currentPosition + 10000L).coerceAtMost(player.duration)) }) {
                                    Icon(Icons.Filled.FastForward, contentDescription = "+10 Sn", tint = Color.White, modifier = Modifier.size(36.dp))
                                }
                            }
                            
                            Spacer(modifier = Modifier.height(20.dp))
                            
                            // Hız Ayarı
                            Text(text = "Hız: " + String.format(Locale.US, "%.2f", playbackSpeed) + "x", color = Color.Gray, fontSize = 14.sp)
                            Slider(
                                value = playbackSpeed,
                                onValueChange = { playbackSpeed = it; player.playbackParameters = PlaybackParameters(it) },
                                valueRange = 0.5f..2.5f,
                                colors = SliderDefaults.colors(thumbColor = Color(0xFFBB86FC), activeTrackColor = Color(0xFFBB86FC))
                            )
                        }
                    }
                }
            }
        }
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.sert.nova'
            compileSdk 34
            defaultConfig {
                applicationId "com.sert.nova"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            buildFeatures {
                compose true
            }
            composeOptions {
                kotlinCompilerExtensionVersion '1.5.1'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2023.08.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.material:material-icons-extended'
            implementation 'androidx.documentfile:documentfile:1.0.1'
            implementation 'androidx.media3:media3-exoplayer:1.2.1'
            implementation 'androidx.media3:media3-ui:1.2.1'
        }
        EOF

    - name: APK Derleme Islemi
      run: |
        GRADLE_VERSION=8.2.1
        wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
        unzip -q gradle-${GRADLE_VERSION}-bin.zip
        export PATH=$PWD/gradle-${GRADLE_VERSION}/bin:$PATH
        gradle wrapper --gradle-version ${GRADLE_VERSION}
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        
    - name: APK Yukle
      uses: actions/upload-artifact@v5
      with:
        name: Nova-App
        path: app/build/outputs/apk/debug/app-debug.apk
