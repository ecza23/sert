name: Nova APK Uretici
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kodlari Cek
      uses: actions/checkout@v5
      
    - name: Java 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Oynatici ve Klasor Yonetimi Kodlarini Enjekte Et
      run: |
        mkdir -p app/src/main/java/com/sert/nova
        cat << 'EOF' > app/src/main/java/com/sert/nova/MainActivity.kt
        package com.sert.nova

        import android.net.Uri
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.rememberLauncherForActivityResult
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.unit.dp
        import androidx.media3.common.MediaItem
        import androidx.media3.common.PlaybackParameters
        import androidx.media3.exoplayer.ExoPlayer

        class MainActivity : ComponentActivity() {
            private lateinit var player: ExoPlayer

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                player = ExoPlayer.Builder(this).build()

                setContent {
                    MaterialTheme {
                        Surface(
                            modifier = Modifier.fillMaxSize(),
                            color = MaterialTheme.colorScheme.background
                        ) {
                            OynaticiEkrani(player = player)
                        }
                    }
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                player.release()
            }
        }

        @Composable
        fun OynaticiEkrani(player: ExoPlayer) {
            var secilenMuzikUri by remember { mutableStateOf<Uri?>(null) }
            var muzinismi by remember { mutableStateOf("Henüz ses dosyası seçilmedi") }
            var playbackSpeed by remember { mutableFloatStateOf(1.0f) }
            var isLooping by remember { mutableStateOf(false) }

            val launcher = rememberLauncherForActivityResult(
                contract = ActivityResultContracts.GetContent()
            ) { uri: Uri? ->
                uri?.let {
                    secilenMuzikUri = it
                    muzinismi = it.lastPathSegment ?: "Bilinmeyen Parça"
                    val mediaItem = MediaItem.fromUri(it)
                    player.setMediaItem(mediaItem)
                    player.prepare()
                    player.play()
                }
            }

            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(20.dp),
                horizontalAlignment = Alignment.CenterHorizontally,
                verticalArrangement = Arrangement.Top
            ) {
                Text(
                    text = "Nova Player Beta",
                    style = MaterialTheme.typography.headlineMedium
                )
                
                Spacer(modifier = Modifier.height(20.dp))

                Button(
                    onClick = { launcher.launch("audio/*") },
                    modifier = Modifier.fillMaxWidth()
                ) {
                    Text("Klasörden Ses / Müzik Seç")
                }

                Spacer(modifier = Modifier.height(10.dp))
                
                Text(
                    text = muzinismi,
                    style = MaterialTheme.typography.bodyMedium,
                    color = MaterialTheme.colorScheme.secondary
                )

                Spacer(modifier = Modifier.height(30.dp))

                Row(
                    horizontalArrangement = Arrangement.SpaceEvenly,
                    modifier = Modifier.fillMaxWidth()
                ) {
                    Button(onClick = { player.play() }) { Text("Oynat") }
                    Button(onClick = { player.pause() }) { Text("Duraklat") }
                }

                Spacer(modifier = Modifier.height(20.dp))

                Row(
                    horizontalArrangement = Arrangement.SpaceEvenly,
                    modifier = Modifier.fillMaxWidth()
                ) {
                    Button(onClick = { 
                        val yeniKonum = (player.currentPosition - 10000L).coerceAtLeast(0L)
                        player.seekTo(yeniKonum) 
                    }) { 
                        Text("-10 Sn") 
                    }
                    
                    Button(onClick = { 
                        val yeniKonum = (player.currentPosition + 10000L).coerceAtMost(player.duration)
                        player.seekTo(yeniKonum) 
                    }) { 
                        Text("+10 Sn") 
                    }
                }

                Spacer(modifier = Modifier.height(30.dp))

                Text(text = "Oynatma Hızı: ${String.format(java.util.Locale.US, "%.2f", playbackSpeed)}x")
                Slider(
                    value = playbackSpeed,
                    onValueChange = { 
                        playbackSpeed = it
                        player.playbackParameters = PlaybackParameters(it)
                    },
                    valueRange = 0.5f..2.5f,
                    steps = 20
                )

                Spacer(modifier = Modifier.height(20.dp))

                Card(modifier = Modifier.fillMaxWidth()) {
                    Row(
                        modifier = Modifier.padding(16.dp),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Checkbox(
                            checked = isLooping,
                            onCheckedChange = { isLooping = it }
                        )
                        Text("A-B Döngüsü (Aynı Parçayı Tekrar Et)")
                    }
                }
            }
        }
        EOF

    - name: APK Derleme Islemi
      run: |
        GRADLE_VERSION=8.2.1
        wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
        unzip -q gradle-${GRADLE_VERSION}-bin.zip
        export PATH=$PWD/gradle-${GRADLE_VERSION}/bin:$PATH
        gradle wrapper --gradle-version ${GRADLE_VERSION}
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        
    - name: APK Yukle
      uses: actions/upload-artifact@v5
      with:
        name: Nova-App
        path: app/build/outputs/apk/debug/app-debug.apk
