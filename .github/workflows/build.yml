name: Nova APK Uretici
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kodlari Cek
      uses: actions/checkout@v5
      
    - name: Java 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Master Onarici (Java 17 & Arayuz Testi)
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.sert.nova'
            compileSdk 34
            defaultConfig {
                applicationId "com.sert.nova"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            buildFeatures {
                compose true
            }
            composeOptions {
                kotlinCompilerExtensionVersion '1.5.1'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2023.08.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
        }
        EOF
        
        mkdir -p app/src/main/java/com/sert/nova
        cat << 'EOF' > app/src/main/java/com/sert/nova/MainActivity.kt
        package com.sert.nova
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.*
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.unit.dp
        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MaterialTheme {
                        Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                            Column(modifier = Modifier.padding(16.dp).fillMaxSize()) {
                                Text("Nova Beta Başarıyla Açıldı!", style = MaterialTheme.typography.headlineMedium)
                                Spacer(modifier = Modifier.height(20.dp))
                                Text("Java 17 uyumsuzluğu giderildi. Sıradaki adımda ExoPlayer ve klasör okuma eklenecek.", color = MaterialTheme.colorScheme.primary)
                            }
                        }
                    }
                }
            }
        }
        EOF
        
    - name: APK Derleme Islemi
      run: |
        GRADLE_VERSION=8.2.1
        wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
        unzip -q gradle-${GRADLE_VERSION}-bin.zip
        export PATH=$PWD/gradle-${GRADLE_VERSION}/bin:$PATH
        gradle wrapper --gradle-version ${GRADLE_VERSION}
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        
    - name: APK Yukle
      uses: actions/upload-artifact@v5
      with:
        name: Nova-App
        path: app/build/outputs/apk/debug/app-debug.apk
